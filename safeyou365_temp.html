  .doc-table-head, .doc-table-row { grid-template-columns: minmax(130px, 2fr) .7fr .45fr; }
  .doc-table-head span:nth-child(2), .doc-table-row em { display: none; }
  .risk-preview-head { padding: 7px 11px; }
  .risk-preview-body { padding: 6px 9px; }
  .edu-preview-tabs span:nth-of-type(n+2) { display: none; }
  .edu-summary-grid { grid-template-columns: .85fr 1.5fr; }
  .edu-list-head, .edu-list-row { grid-template-columns: 1.5fr .7fr .55fr; }
  .edu-list-head span:nth-child(2), .edu-list-row span { display: none; }
  .company-roll-head { margin-bottom: 15px; }
  .company-roll-head h2 { font-size: 20px; }
  .company-roll-item { min-width: 142px; padding: 10px 13px; font-size: 13px; }
}


/* 핵심기능 모바일 탭: 모든 버튼을 한 화면에 표시 */
@media (max-width: 640px) {
  .feature-tabs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    overflow: visible;
    padding-bottom: 0;
  }
  .feature-tabs .feature-tab-button {
    width: 100%;
    min-width: 0;
    min-height: 52px;
    padding: 10px 8px;
    white-space: normal;
    text-align: center;
    line-height: 1.25;
  }
  .feature-tabs .feature-tab-button:last-child:nth-child(odd) {
    grid-column: 1 / -1;
  }
}


/* 모바일 앱 미리보기 하단 내비게이션 */
.app-bottom-nav {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  min-height: 62px;
  border-top: 1px solid #e5e7eb;
  background: #f3f4f6;
  padding: 5px 7px 7px;
}
.app-bottom-item {
  position: relative;
  display: flex;
  min-width: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: #9ca0a7;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
}
.app-bottom-item svg { stroke-width: 2.2; }
.app-bottom-item.is-active {
  background: transparent;
  color: #ff6200;
}
.app-bottom-icon-wrap { position: relative; display: inline-flex; }
.app-bottom-badge {
  position: absolute;
  top: -8px;
  right: -10px;
  display: grid;
  width: 17px;
  height: 17px;
  place-items: center;
  border: 2px solid #f3f4f6;
  border-radius: 999px;
  background: #f04418;
  color: #fff;
  font-size: 8px;
  font-style: normal;
  font-weight: 800;
  line-height: 1;
}


/* AI 안전상담 챗봇 대화 미리보기 */
.ai-chat-list { display: flex; flex-direction: column; gap: 10px; }
.ai-chat-row { display: flex; align-items: flex-start; gap: 8px; }
.ai-chat-row.is-bot { flex-direction: row-reverse; }
.ai-chat-avatar {
  display: grid;
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  place-items: center;
  border-radius: 50%;
}
.ai-chat-avatar.is-worker { background: #7b8494; color: #fff; }
.ai-chat-avatar.is-bot { background: #ff6200; color: #fff; }
.ai-chat-bubble {
  max-width: calc(100% - 38px);
  border-radius: 12px;
  padding: 9px 11px;
  color: #333;
  font-size: 12px;
  line-height: 1.55;
}
.ai-chat-row.is-worker .ai-chat-bubble {
  border-top-left-radius: 4px;
  background: #f3f5f8;
}
.ai-chat-row.is-bot .ai-chat-bubble {
  border: 1px solid #ffd8bd;
  border-top-right-radius: 4px;
  background: #fff5ed;
}
.ai-chat-typing {
  display: flex;
  align-items: center;
  gap: 4px;
  padding-left: 36px;
  color: #718096;
  font-size: 10px;
}
</style>
<style>
/* 기능안내 모바일 메뉴: 모든 항목을 화면 안에 표시 */
@media (max-width: 639px) {
  .feature-nav-scroll {
    flex-wrap: wrap;
    overflow-x: visible;
    row-gap: 6px;
  }

  .feature-nav-button {
    padding-left: 10px;
    padding-right: 10px;
    font-size: 12px;
    line-height: 1.25rem;
  }

  main section[data-id] {
    scroll-margin-top: 240px;
  }
}
</style>

<script>
/* 기업명 롤링 실행 보완 */
(() => {
  const startRoller = () => {
    document.querySelectorAll('.company-roll-track:not([data-rolling])').forEach((track) => {
      track.dataset.rolling = 'true';
      track.classList.add('is-js-rolling');
      let position = 0;
      let previousTime = performance.now();
      const move = (currentTime) => {
        const firstGroup = track.querySelector('.company-roll-group');
        if (!firstGroup || !track.isConnected) return;
        const loopWidth = firstGroup.getBoundingClientRect().width + 14;
        position += (currentTime - previousTime) * 0.045;
        previousTime = currentTime;
        if (loopWidth > 0 && position >= loopWidth) position -= loopWidth;
        track.style.transform = `translate3d(${-position}px, 0, 0)`;
        requestAnimationFrame(move);
      };
      requestAnimationFrame(move);
    });
  };
  window.addEventListener('hashchange', () => window.setTimeout(startRoller, 0));
  startRoller();
})();
</script>

<script>
/* 화면에 들어오면 채팅 문장을 글자별로 입력하고 반복 재생 */
(() => {
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  const prepareChatTyping = (chat) => {
    if (chat.dataset.typingReady === 'true') return;

    const rows = [...chat.querySelectorAll('.ai-chat-row')];
    const typing = chat.querySelector('.ai-chat-typing');
    if (!rows.length || !typing) return;

    chat.dataset.typingReady = 'true';
    const messages = rows.map((row) => {
      const bubble = row.querySelector('.ai-chat-bubble');
      const box = bubble.getBoundingClientRect();
      bubble.style.minWidth = `${Math.ceil(box.width)}px`;
      bubble.style.minHeight = `${Math.ceil(box.height)}px`;
      return { row, bubble, text: bubble.textContent, isBot: row.classList.contains('is-bot') };
    });

    rows.forEach((row) => { row.dataset.chatState = 'hidden'; });
    typing.classList.remove('is-visible');

    const typeMessage = async ({ bubble, text, isBot }) => {
      bubble.textContent = '';
      bubble.classList.add('is-typing');
      for (const character of Array.from(text)) {
        if (!chat.isConnected) return false;
        bubble.textContent += character;
        await wait((isBot ? 24 : 34) + Math.random() * 18);
      }
      bubble.classList.remove('is-typing');
      return true;
    };

    const play = async () => {
      while (chat.isConnected) {
        messages.forEach(({ row, bubble, text }) => {
          row.dataset.chatState = 'hidden';
          bubble.textContent = text;
          bubble.classList.remove('is-typing');
        });
        typing.classList.remove('is-visible');
        chat.appendChild(typing);
        await wait(450);

        for (const message of messages) {
          if (!chat.isConnected) return;
          if (message.isBot) {
            chat.insertBefore(typing, message.row);
            typing.classList.add('is-visible');
            await wait(750);
            typing.classList.remove('is-visible');
            await wait(140);
          }
          message.row.dataset.chatState = 'visible';
          if (!(await typeMessage(message))) return;
          await wait(message.isBot ? 650 : 420);
        }

        chat.appendChild(typing);
        await wait(2600);
      }
    };

    play();
  };

  const scan = () => {
    document.querySelectorAll('.ai-chat-list').forEach(prepareChatTyping);
  };
  window.addEventListener('hashchange', () => window.setTimeout(scan, 0));
  scan();
})();
</script>

<script>
/* 1번부터 5번까지 현재 단계를 차례로 표시 */
(() => {
  const findProcessLists = () => {
    document.querySelectorAll('p').forEach((label) => {
      if (label.textContent.trim() !== '위험성평가 작성 과정') return;
      const list = [...label.parentElement.children].find((element) =>
        element.classList.contains('space-y-3')
      );
      if (!list) return;
      label.textContent = 'AI 위험성평가 진행';
      if (list.dataset.riskStepReady === 'true') return;

      const steps = [...list.children].filter((element) => element.tagName === 'DIV');
      if (steps.length !== 5) return;

      list.dataset.riskStepReady = 'true';
      list.classList.add('risk-process-list');
      let currentStep = 0;

      const showStep = () => {
        if (!list.isConnected) return;
        steps.forEach((step, index) => {
          const isActive = index === currentStep;
          step.classList.toggle('is-risk-active', isActive);
          if (isActive) step.setAttribute('aria-current', 'step');
          else step.removeAttribute('aria-current');
        });
        currentStep = (currentStep + 1) % steps.length;
        setTimeout(showStep, currentStep === 0 ? 2200 : 1500);
      };
      showStep();
    });
  };

  window.addEventListener('hashchange', () => window.setTimeout(findProcessLists, 0));
  findProcessLists();
})();
</script>

<script>
/* 한국어와 베트남어 말풍선을 순서대로 타이핑 */
(() => {
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  const preparePhoneChat = () => {
    document.querySelectorAll('.chat-phone-header').forEach((header) => {
      const chat = header.nextElementSibling;
      if (!chat || chat.dataset.phoneTypingReady === 'true') return;
      const bubbles = [...chat.children].filter((element) => element.tagName === 'DIV');
      if (bubbles.length !== 4) return;

      chat.dataset.phoneTypingReady = 'true';
      chat.classList.add('phone-translation-chat');
      const composer = chat.nextElementSibling;
      if (composer) composer.classList.add('phone-chat-composer');

      const messages = bubbles.map((bubble) => {
        const box = bubble.getBoundingClientRect();
        bubble.classList.add('phone-chat-message');
        bubble.style.minWidth = `${Math.ceil(box.width)}px`;
        bubble.style.minHeight = `${Math.ceil(box.height)}px`;
        return {
          bubble,
          text: bubble.textContent,
          isTranslation: bubble.classList.contains('bg-brand')
        };
      });

      const typeMessage = async ({ bubble, text, isTranslation }) => {
        bubble.textContent = '';
        bubble.classList.add('is-typing');
        for (const character of Array.from(text)) {
          if (!chat.isConnected) return false;
          bubble.textContent += character;
          await wait((isTranslation ? 27 : 34) + Math.random() * 16);
        }
        bubble.classList.remove('is-typing');
        return true;
      };

      const play = async () => {
        while (chat.isConnected) {
          messages.forEach(({ bubble, text }) => {
            bubble.dataset.phoneChatState = 'hidden';
            bubble.textContent = text;
            bubble.classList.remove('is-typing');
          });
          composer?.classList.remove('is-translating');
          await wait(400);

          for (const message of messages) {
            if (message.isTranslation) {
              composer?.classList.add('is-translating');
              await wait(650);
              composer?.classList.remove('is-translating');
            }
            message.bubble.dataset.phoneChatState = 'visible';
            if (!(await typeMessage(message))) return;
            await wait(message.isTranslation ? 600 : 400);
          }
          await wait(2400);
        }
      };
      play();
    });

<script>
/* 슬라이더 위치에 맞춰 허용 기준 점수도 함께 변경 */
(() => {
  const prepareRiskSlider = () => {
    document.querySelectorAll('.risk-threshold-card').forEach((card) => {
      if (card.dataset.sliderReady === 'true') return;
      const scoreTitle = card.querySelector('.risk-score-title');
      const score = scoreTitle?.querySelector('span');
      const slider = card.querySelector('.risk-slider');
      const fill = slider?.querySelector('i');
      const thumb = slider?.querySelector('b');
      if (!scoreTitle || !score || !slider || !fill || !thumb) return;

      card.dataset.sliderReady = 'true';
      scoreTitle.classList.add('is-animated');
      slider.classList.add('is-animated');
      const startedAt = performance.now();
      const minimum = 28;
      const maximum = 82;
      const cycleDuration = 6400;

      const animate = (now) => {
        if (!card.isConnected) return;
        const cycle = ((now - startedAt) % cycleDuration) / cycleDuration;
        const forward = cycle < .5 ? cycle * 2 : (1 - cycle) * 2;
        const eased = .5 - Math.cos(Math.PI * forward) / 2;
        const position = minimum + (maximum - minimum) * eased;
        fill.style.width = `${position}%`;
        thumb.style.left = `${position}%`;
        score.textContent = String(Math.round(position / 5));
        requestAnimationFrame(animate);
      };
      requestAnimationFrame(animate);
    });
  };

  window.addEventListener('safetyyou:prepare-risk-slider', prepareRiskSlider);
  window.addEventListener('hashchange', () => window.setTimeout(prepareRiskSlider, 0));
  prepareRiskSlider();
})();
</script>

<script>
/* 원형 그래프를 0점부터 82점까지 채우며 숫자도 함께 증가 */
(() => {
  const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

  const prepareSystemDonut = () => {
    document.querySelectorAll('.system-donut').forEach((donut) => {
      if (donut.dataset.donutReady === 'true') return;
      const number = donut.querySelector('strong');
      if (!number) return;

      donut.dataset.donutReady = 'true';
      donut.classList.add('is-animated');
      const targetScore = 82;
      const fillDuration = 2600;

      const animateOnce = () => new Promise((resolve) => {
        const startedAt = performance.now();
        const draw = (now) => {
          if (!donut.isConnected) {
            resolve(false);
            return;
          }
          const progress = Math.min(1, (now - startedAt) / fillDuration);
          const eased = 1 - Math.pow(1 - progress, 3);
          const value = Math.round(targetScore * eased);
          donut.style.background = `conic-gradient(#ff6200 0 ${value}%, #eceff2 ${value}% 100%)`;
          number.textContent = String(value);

          if (progress < 1) {
            requestAnimationFrame(draw);
          } else {
            resolve(true);
          }
        };
        requestAnimationFrame(draw);
      });

      const play = async () => {
        while (donut.isConnected) {
          donut.classList.remove('is-complete');
          donut.style.background = 'conic-gradient(#ff6200 0 0%, #eceff2 0 100%)';
          number.textContent = '0';
          await wait(450);
          if (!(await animateOnce())) return;
          donut.classList.add('is-complete');
          await wait(2000);

      };
      play();

<script>
/* 체계구축 진행 현황을 1단계부터 5단계까지 순서대로 표시 */
(() => {
  const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

  const prepareDocumentProgress = () => {
    document.querySelectorAll('.doc-progress-track').forEach((track) => {
      if (track.dataset.sequenceReady === 'true') return;
      const steps = Array.from(track.querySelectorAll('.doc-step')).slice(0, 5);
      const line = track.querySelector('.doc-progress-line');
      const status = track.closest('.doc-progress-card')?.querySelector('.doc-card-heading span');
      if (steps.length !== 5 || !line || !status) return;

      track.dataset.sequenceReady = 'true';
      track.classList.add('is-sequencing');
      steps.forEach((step) => step.classList.remove('is-done', 'is-current'));

      const reset = () => {
        line.style.setProperty('--doc-progress', '0%');
        status.textContent = '0/5 진행';
        steps.forEach((step, index) => {
          step.classList.remove('is-sequence-done', 'is-sequence-current');
          const icon = step.querySelector('i');
          if (icon) icon.textContent = String(index + 1);
        });
      };

      const play = async () => {
        while (track.isConnected) {
          reset();
          await wait(500);

          for (let index = 0; index < steps.length; index += 1) {
            if (!track.isConnected) return;
            const step = steps[index];
            const icon = step.querySelector('i');
            step.classList.add('is-sequence-current');
            line.style.setProperty('--doc-progress', `${index * 25}%`);
            status.textContent = `${Math.min(index, 4)}/5 완료`;
            await wait(900);

            if (index < steps.length - 1) {
              step.classList.remove('is-sequence-current');
              step.classList.add('is-sequence-done');
              if (icon) icon.textContent = '✓';
            }
          }

          status.textContent = '4/5 완료';
          await wait(2200);
        }
      };
      play();
    });
  };

  window.addEventListener('safetyyou:prepare-document-progress', prepareDocumentProgress);
  window.addEventListener('hashchange', () => window.setTimeout(prepareDocumentProgress, 0));
  prepareDocumentProgress();
})();
</script>

@keyframes diagnosisRadarPointPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.35); }
}

<script>
/* 레이더 도형과 7개 요소 점수를 0부터 목표값까지 함께 증가 */
(() => {
  const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

  const prepareDiagnosisRadar = () => {
    document.querySelectorAll('.diagnosis-radar-svg').forEach((svg) => {
      if (svg.dataset.radarReady === 'true') return;
      const area = svg.querySelector('.radar-area');
      const points = Array.from(svg.querySelectorAll('.radar-point, .radar-center'));
      const levels = svg.closest('.diagnosis-core')?.querySelector('.diagnosis-levels');
      const scores = levels ? Array.from(levels.querySelectorAll('.diagnosis-level-row b')) : [];
      if (!area || points.length !== 7 || scores.length !== 7) return;

      const targetPoints = area.getAttribute('points').trim().split(/\s+/).map((pair) => pair.split(',').map(Number));
      const targetScores = scores.map((score) => Number.parseInt(score.textContent, 10) || 0);
      const center = [70, 65];
      const duration = 2600;
      if (targetPoints.length !== 7) return;

      svg.dataset.radarReady = 'true';
      svg.classList.add('is-animated');
      levels.classList.add('is-counting');

      const render = (progress) => {
        const eased = 1 - Math.pow(1 - progress, 3);
        const currentPoints = targetPoints.map(([targetX, targetY]) => {
          const x = center[0] + (targetX - center[0]) * eased;
          const y = center[1] + (targetY - center[1]) * eased;
          return [x, y];
        });
        area.setAttribute('points', currentPoints.map(([x, y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(' '));
        points.forEach((point, index) => {
          point.setAttribute('cx', currentPoints[index][0].toFixed(2));
          point.setAttribute('cy', currentPoints[index][1].toFixed(2));
        });
        scores.forEach((score, index) => {
          score.textContent = `${Math.round(targetScores[index] * eased)}점`;
        });
      };

      const animateOnce = () => new Promise((resolve) => {
        const startedAt = performance.now();
        const draw = (now) => {
          if (!svg.isConnected) {
            resolve(false);
            return;
          }
          const progress = Math.min(1, (now - startedAt) / duration);
          render(progress);
          if (progress < 1) {
            requestAnimationFrame(draw);
          } else {
            resolve(true);
          }
        };
        requestAnimationFrame(draw);
      });

      const play = async () => {
        while (svg.isConnected) {
          svg.classList.remove('is-complete');
          render(0);
          await wait(450);
          if (!(await animateOnce())) return;
          svg.classList.add('is-complete');
          await wait(2400);
        }
      };
      play();
    });
  };

  window.addEventListener('safetyyou:prepare-diagnosis-radar', prepareDiagnosisRadar);
  window.addEventListener('hashchange', () => window.setTimeout(prepareDiagnosisRadar, 0));
  prepareDiagnosisRadar();
})();
</script>

<script>
/* 기능안내의 chat 섹션 우측 미리보기만 스마트폰 무전기로 교체 */
(() => {
  const walkieMarkup = `
    <div class="walkie-phone-shell" role="img" aria-label="통번역 무전기 스마트폰 화면">
      <div class="walkie-phone-notch"></div>
      <div class="walkie-phone-screen">
        <header class="walkie-phone-head">
          <span class="walkie-language-mark">文A</span>
          <span class="walkie-phone-title"><strong>통번역 무전기</strong><small>● 5명 접속 중</small></span>
          <span class="walkie-toggle" aria-hidden="true"></span>
        </header>
        <div class="walkie-conversation">
          <div class="walkie-message is-korean" data-message="2번 사출기에서 불량이 계속 발생하고 있어요."></div>
          <div class="walkie-message is-translated" data-message="Tôi sẽ kiểm tra."></div>
          <div class="walkie-message is-korean" data-message="불량이 심한가요?"></div>
          <div class="walkie-message is-translated" data-message="Đang bảo trì."></div>
        </div>
        <div class="walkie-talk-zone"><span class="walkie-mic-button" aria-hidden="true"><i class="walkie-mic-icon"></i></span></div>
      </div>
    </div>`;

  const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

  const playWalkieTyping = async (preview) => {
    if (preview.dataset.walkieTyping === 'true') return;
    preview.dataset.walkieTyping = 'true';
    const messages = Array.from(preview.querySelectorAll('.walkie-message'));
    const texts = messages.map((message) => message.dataset.message || '');

    while (preview.isConnected) {
      messages.forEach((message) => {
        message.textContent = '';
        message.classList.remove('is-typing-visible', 'is-typing');
      });
      await wait(550);

      for (let index = 0; index < messages.length; index += 1) {
        if (!preview.isConnected) return;
        const message = messages[index];
        message.classList.add('is-typing-visible', 'is-typing');
        for (const character of Array.from(texts[index])) {
          message.textContent += character;
          await wait(index % 2 === 0 ? 42 : 48);
        }
        message.classList.remove('is-typing');
        await wait(520);
      }
      await wait(2000);
    }
  };

  const replaceChatPreview = () => {
    const section = document.querySelector('section#chat');
    const layout = section?.firstElementChild;
    const preview = layout?.children?.[1];
    if (!preview || preview.dataset.walkiePreview === 'true') return;
    preview.dataset.walkiePreview = 'true';
    preview.className = 'walkie-feature-only';
    preview.innerHTML = walkieMarkup;
    playWalkieTyping(preview);
  };

  window.addEventListener('hashchange', () => window.setTimeout(replaceChatPreview, 0));
  replaceChatPreview();
})();
</script>

    ['안전보건관리체계 진단', '일반', '일반', '다차원']
  ];

  const cellClasses = [
    'px-4 py-3 text-ink font-medium',
    'px-4 py-3 text-center text-sub',
    'px-4 py-3 text-center text-ink font-semibold',
    'px-4 py-3 text-center text-sub'
  ];

  const updateComparisonTable = () => {
    const heading = Array.from(document.querySelectorAll('h2')).find(
      (element) => element.textContent.trim() === '전체 기능 비교'
    );
    const table = heading?.parentElement?.querySelector('table');
    const tbody = table?.querySelector('tbody');
    if (!tbody) return;

    comparisonRows.forEach((values, rowIndex) => {
      let row = tbody.rows[rowIndex];
      if (!row) {
        row = document.createElement('tr');
        row.className = 'border-t border-line';
        values.forEach((_, cellIndex) => {
          const cell = document.createElement('td');
          cell.className = cellClasses[cellIndex];
          row.appendChild(cell);
        });
        tbody.appendChild(row);
      }

      values.forEach((value, cellIndex) => {
        const cell = row.cells[cellIndex];
        if (cell && cell.textContent !== value) cell.textContent = value;
      });

    });

<script>
/* 상단 사용안내 외부 링크 */
(() => {
  const guideUrl = 'https://ktkartisan.com/SAFEYOU/index.html';
  const updateGuideLinks = () => {
    document.querySelectorAll('header a').forEach((link) => {
      if (link.textContent.trim() !== '사용안내') return;
      link.href = guideUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
    });
  };

  const updateClickedGuideLink = (event) => {
    const link = event.target.closest?.('header a');
    if (!link || link.textContent.trim() !== '사용안내') return;
    link.href = guideUrl;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
  };

  window.addEventListener('hashchange', () => window.setTimeout(updateGuideLinks, 0));
  window.addEventListener('load', updateGuideLinks);
  document.addEventListener('pointerdown', updateClickedGuideLink, true);
  document.addEventListener('click', (event) => {
    updateClickedGuideLink(event);
    window.setTimeout(updateGuideLinks, 0);
  }, true);
  window.requestAnimationFrame(() => window.requestAnimationFrame(updateGuideLinks));
  window.setTimeout(updateGuideLinks, 100);
  updateGuideLinks();
})();
</script>
</body>
</html>
